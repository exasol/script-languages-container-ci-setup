rules:
  unpinned-uses:
    # Official GitHub actions & ones maintained by us may use a referential pin.
    # Third party GitHub actions must be defined with an SHA hash.
    config:
      policies:
        "actions/*": ref-pin
        exasol/python-toolbox/.github/actions/python-environment: ref-pin
        "*": hash-pin
  excessive-permissions:
    ignore: []
  secrets-inherit:
    ignore: []
  template-injection:
    ignore: []
  artipacked:
    ignore:
      - slc_cd.yml
      - slc_cd_self_check.yml
      - slc_cd_upload_to_release.yml
      - slc_ci.yml
      - slc_ci_build_slc.yml
      - slc_ci_check_for_build.yml
      - slc_ci_prepare_test_container.yml
      - slc_ci_self_check.yml
      - slc_ci_test_slc.yml
      - slc_nightly.yml
      - slc_nightly_self_check.yml
      - slow-checks.yml
      - validate_slc_github_workflows.yml
